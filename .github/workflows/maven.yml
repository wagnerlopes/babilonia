# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build with Maven (skip tests)
        run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests + coverage
        run: mvn -B verify jacoco:report

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco

  javadocs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Javadocs
        run: mvn -B compile javadoc:javadoc

      - name: Upload Javadocs (artifact)
        if: success() && always()
        uses: actions/upload-artifact@v4
        with:
          name: javadocs
          path: target/site/apidocs

  checkstyle:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: Upload Checkstyle report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle
          path: target/site/checkstyle.html

  spotbugs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run SpotBugs
        run: mvn -B spotbugs:spotbugs

      - name: Upload SpotBugs report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs
          path: target/site/spotbugs.html

  deploy:
    runs-on: ubuntu-latest
    needs: [test, javadocs, checkstyle, spotbugs]
    steps:
      - name: Download Jacoco
        uses: actions/download-artifact@v4
        with:
          name: jacoco
          path: quality/coverage

      - name: Download Javadocs
        uses: actions/download-artifact@v4
        with:
          name: javadocs
          path: quality/javadocs

      - name: Download Checkstyle
        uses: actions/download-artifact@v4
        with:
          name: checkstyle
          path: quality

      - name: Download SpotBugs
        uses: actions/download-artifact@v4
        with:
          name: spotbugs
          path: quality

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: quality

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
