name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B verify jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

  javadocs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B compile javadoc:javadoc
      - uses: actions/upload-artifact@v4
        with:
          name: javadocs
          path: target/site/apidocs
          if-no-files-found: ignore

  checkstyle:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B checkstyle:checkstyle
      - uses: actions/upload-artifact@v4
        with:
          name: checkstyle
          path: target/site/checkstyle/checkstyle.html
          if-no-files-found: ignore

  spotbugs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B spotbugs:spotbugs
      - uses: actions/upload-artifact@v4
        with:
          name: spotbugs
          path: target/site/spotbugs.html
          if-no-files-found: ignore

  deployment:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: [test, javadocs, checkstyle, spotbugs]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jacoco
          path: quality/coverage
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: javadocs
          path: quality/javadocs
        continue-on-error: true
        
      - uses: actions/download-artifact@v4
        with:
          name: checkstyle
          path: quality
        continue-on-error: true
        
      - uses: actions/download-artifact@v4
        with:
          name: spotbugs
          path: quality
        continue-on-error: true

      - name: Obter versão do Maven
        id: version
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date '+%d/%m/%Y %H:%M')" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          
      - name: Create index.html
        run: |
          cat <<EOF > quality/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <title>Portal de Qualidade - Babilonia</title>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
          </head>
          <body class="m-5">
            <h1>Portal de Qualidade do Projeto Babilônia</h1>
            <hr>
            <p><strong>Versão:</strong> ${VERSION}</p>
            <p><strong>Build:</strong> ${BUILD_DATE}</p>
            <p><strong>Commit:</strong> ${COMMIT_SHA}</p>            
            <h2>Relatórios gerados automaticamente:</h2>
            <ul>
              <li>📊 <a href="coverage/index.html">Cobertura de Testes (Jacoco)</a></li>
              <li>📚 <a href="javadocs/index.html">Documentação (Javadocs)</a></li>
              <li>✅ <a href="checkstyle.html">Relatório de Estilo (Checkstyle)</a></li>
              <li>🐞 <a href="spotbugs.html">Relatório de Bugs (SpotBugs)</a></li>
            </ul>
            <hr>
            <p>(c)2026 WagnerSoft IT Solutions.</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./quality

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
