# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B verify jacoco:report
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

  javadocs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B compile javadoc:javadoc
      - uses: actions/upload-artifact@v4
        with:
          name: javadocs
          path: target/apidocs
          if-no-files-found: ignore

  checkstyle:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B checkstyle:checkstyle
      - uses: actions/upload-artifact@v4
        with:
          name: checkstyle
          path: target/site/checkstyle.html
          if-no-files-found: ignore

  spotbugs:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B spotbugs:spotbugs
      - uses: actions/upload-artifact@v4
        with:
          name: spotbugs
          path: target/site/spotbugs.html
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [test, javadocs, checkstyle, spotbugs]
    steps:
      - name: Download Jacoco
        uses: actions/download-artifact@v4
        with:
          name: jacoco
          path: quality/coverage

      - name: Download Javadocs
        uses: actions/download-artifact@v4
        with:
          name: javadocs
          path: quality/javadocs

      - name: Download Checkstyle
        uses: actions/download-artifact@v4
        with:
          name: checkstyle
          path: quality

      - name: Download SpotBugs
        uses: actions/download-artifact@v4
        with:
          name: spotbugs
          path: quality

      - name: Create index.html
        run: |
          cat <<'EOF' > quality/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <title>Portal de Qualidade - Projeto</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
              h1 { color: #2c3e50; }
              ul { list-style-type: none; padding: 0; }
              li { margin: 10px 0; }
              a { text-decoration: none; color: #2980b9; font-weight: bold; }
              a:hover { color: #e74c3c; }
            </style>
          </head>
          <body>
            <h1>Portal de Qualidade do Projeto</h1>
            <p>Relatórios gerados automaticamente:</p>
            <ul>
              <li>📊 <a href="coverage/index.html">Cobertura de Testes (Jacoco)</a></li>
              <li>📚 <a href="javadocs/index.html">Documentação (Javadocs)</a></li>
              <li>✅ <a href="checkstyle.html">Relatório de Estilo (Checkstyle)</a></li>
              <li>🐞 <a href="spotbugs.html">Relatório de Bugs (SpotBugs)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quality

      - uses: actions/deploy-pages@v5
        id: deploy
